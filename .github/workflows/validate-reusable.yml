name: Validate third-party content (reusable)

# Called by other repos (e.g. Stonetop-Resources) so ONE validator definition
# governs every content source Sled Dog pulls from. Usage in the caller repo:
#
#   jobs:
#     validate:
#       uses: Pup-Pup-Games/sleddog-third-party-content/.github/workflows/validate-reusable.yml@main
#
on:
  workflow_call:
    inputs:
      content_dir:
        description: Directory of content to validate, relative to the caller repo root.
        type: string
        default: content
      validator_ref:
        description: Ref of sleddog-third-party-content to use as the validator + schema.
        type: string
        default: main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content to validate
        uses: actions/checkout@v4
        with:
          path: content-src
      - name: Checkout validator + schema
        uses: actions/checkout@v4
        with:
          repository: Pup-Pup-Games/sleddog-third-party-content
          ref: ${{ inputs.validator_ref }}
          path: validator
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install validator dependencies
        working-directory: validator
        run: npm install --no-audit --no-fund
      - name: Validate content
        run: node validator/scripts/validate.mjs --content "content-src/${{ inputs.content_dir }}" --schema validator/schema
